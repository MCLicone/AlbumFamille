<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album Famille</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

video {
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
}

#error {
    display: none;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 24px;
}
</style>
</head>

<body>

<video id="video" controls playsinline preload="metadata"></video>

<div id="error"></div>

<script>
(async function() {

    const id = new URLSearchParams(window.location.search).get("v");

    const video = document.getElementById("video");
    const error = document.getElementById("error");

    if (!id) {
        video.style.display = "none";
        error.textContent = "Vidéo introuvable.";
        error.style.display = "block";
        return;
    }

    try {

        const response = await fetch("videos.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("videos.json inaccessible");
        }

        const videos = await response.json();

        const url = videos[id];

        if (!url) {
            throw new Error("Vidéo inconnue");
        }

        video.src = url;
        video.load();

    } catch (e) {

        video.style.display = "none";
        error.textContent = "Vidéo introuvable.";
        error.style.display = "block";

    }

})();
</script>

</body>
</html>
